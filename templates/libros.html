{{template "header" .}}

<h2>{{.Titulo}}</h2>
<a href="/libros/nuevo" class="btn btn-primary btn-sm mb-3">Nuevo Libro</a>

<form action="/libros/buscar" method="GET" class="row mb-3">
    <div class="col-md-4">
        <select name="categoria_id" class="form-select form-select-sm">
            <option value="0">-- Todas las categorías --</option>
            {{range .Categorias}}
            <option value="{{.GetID}}" {{if eq (printf "%d" .GetID) $.CategoriaSeleccionada}}selected{{end}}>{{.GetNombre}}</option>
            {{end}}
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-dark btn-sm">Buscar Libros</button>
    </div>
</form>

{{if .Libros}}
<table class="table table-striped table-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Categoría</th>
            <th>ISBN</th>
            <th>Formato</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {{range .Libros}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Titulo}}</td>
            <td>{{.Autor}}</td>
            <td>{{.Categoria}}</td>
            <td>{{.ISBN}}</td>
            <td>{{.Formato}}</td>
            <td>
                <a href="/libros/editar/{{.ID}}" class="btn btn-warning btn-sm">Editar</a>
                <form action="/libros/eliminar/{{.ID}}" method="POST" style="display:inline;"
                      onsubmit="return confirm('¿Eliminar libro?')">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<p>No se encontraron libros.</p>
{{end}}

{{template "footer" .}}

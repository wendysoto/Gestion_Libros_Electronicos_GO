{{template "header" .}}

<h2>{{.Titulo}}</h2>

{{if .Error}}<p style="color:red;">{{.Error}}</p>{{end}}

<form action="/libros/nuevo" method="POST" style="max-width:500px;">
    <div class="mb-2">
        <label class="form-label">Título</label>
        <input type="text" class="form-control form-control-sm" name="titulo" required>
    </div>
    <div class="mb-2">
        <label class="form-label">Autor</label>
        <input type="text" class="form-control form-control-sm" name="autor" required>
    </div>
    <div class="mb-2">
        <label class="form-label">Categoría</label>
        <select class="form-select form-select-sm" name="categoria_id" required>
            <option value="">-- Seleccione --</option>
            {{range .Categorias}}
            <option value="{{.GetID}}">{{.GetNombre}}</option>
            {{end}}
        </select>
    </div>
    <div class="mb-2">
        <label class="form-label">ISBN</label>
        <input type="text" class="form-control form-control-sm" name="isbn" required>
    </div>
    <div class="mb-2">
        <label class="form-label">Formato</label>
        <select class="form-select form-select-sm" name="formato" required>
            <option value="PDF">PDF</option>
            <option value="EPUB">EPUB</option>
            <option value="MOBI">MOBI</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
    <a href="/libros" class="btn btn-secondary btn-sm">Cancelar</a>
</form>

{{template "footer" .}}

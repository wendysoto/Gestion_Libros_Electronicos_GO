{{template "header" .}}

<h2>{{.Titulo}}</h2>

{{if .Error}}<p style="color:red;">{{.Error}}</p>{{end}}

<form action="/usuarios/editar/{{.Usuario.GetID}}" method="POST" style="max-width:500px;">
    <div class="mb-2">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control form-control-sm" name="nombre" value="{{.Usuario.GetNombre}}" required>
    </div>
    <div class="mb-2">
        <label class="form-label">Email</label>
        <input type="email" class="form-control form-control-sm" name="email" value="{{.Usuario.GetEmail}}" required>
    </div>
    <div class="mb-2">
        <label class="form-label">Tipo</label>
        <select class="form-select form-select-sm" name="tipo" required>
            <option value="lector" {{if eq (printf "%s" .Usuario.GetTipo) "lector"}}selected{{end}}>Lector</option>
            <option value="admin" {{if eq (printf "%s" .Usuario.GetTipo) "admin"}}selected{{end}}>Administrador</option>
        </select>
    </div>
    <button type="submit" class="btn btn-warning btn-sm">Actualizar</button>
    <a href="/usuarios" class="btn btn-secondary btn-sm">Cancelar</a>
</form>

{{template "footer" .}}
